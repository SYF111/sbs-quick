<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>quick_sbs — 快速3D转换</title>
<style>
:root { --bg: #111827; --card: #1f2937; --border: #374151; --text: #e5e7eb; --dim: #9ca3af; --green: #22c55e; --red: #ef4444; --blue: #3b82f6; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; }
header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 18px; font-weight: 600; }
.badge { font-size: 12px; background: var(--green); color: #000; padding: 2px 10px; border-radius: 10px; font-weight: 700; margin-left: 10px; }
.warn { color: var(--red); font-size: 12px; margin-right: 10px; }
.tabs { display: flex; gap: 0; padding: 0 32px; border-bottom: 1px solid var(--border); background: var(--card); }
.tab { padding: 12px 28px; cursor: pointer; border: none; background: none; color: var(--dim); font-size: 14px; border-bottom: 2px solid transparent; transition: all .2s; }
.tab.active { color: #fff; border-bottom-color: var(--green); }
main { max-width: 960px; margin: 24px auto; padding: 0 24px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin-bottom: 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 720px) { .grid2 { grid-template-columns: 1fr; } }
label { display: block; margin-bottom: 4px; font-size: 13px; color: var(--dim); font-weight: 500; }
.slider-row { display: flex; align-items: center; gap: 10px; }
.slider-row input[type=range] { flex: 1; accent-color: var(--green); }
.slider-row .val { min-width: 36px; text-align: right; font-size: 13px; color: var(--dim); }
select, .btn { padding: 10px 16px; border-radius: 8px; font-size: 14px; }
select { background: #111827; color: var(--text); border: 1px solid var(--border); width: 100%; }
.btn { border: none; font-weight: 600; cursor: pointer; transition: all .2s; width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; }
.btn-go { background: var(--green); color: #000; }
.btn-go:hover { background: #16a34a; }
.btn-go:disabled { background: #374151; color: #6b7280; cursor: not-allowed; }
.upload-area { border: 2px dashed var(--border); border-radius: 10px; padding: 40px; text-align: center; cursor: pointer; transition: all .2s; margin-bottom: 16px; }
.upload-area:hover, .upload-area.drag { border-color: var(--green); background: rgba(34,197,94,0.05); }
.upload-area .icon { font-size: 40px; margin-bottom: 8px; }
.upload-area .hint { font-size: 13px; color: var(--dim); margin-top: 4px; }
.file-info { font-size: 12px; color: var(--dim); margin-top: 4px; word-break: break-all; }
.estimate { font-size: 13px; color: var(--dim); margin: 8px 0; padding: 8px 12px; background: #111827; border-radius: 6px; }
.job-list { margin-top: 12px; }
.job { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
.job:last-child { border-bottom: none; }
.job .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.job .status { font-size: 12px; min-width: 80px; text-align: right; }
.job .status.done { color: var(--green); }
.job .status.error { color: var(--red); }
.job .status.running { color: var(--blue); }
.progress-bar { width: 100%; height: 4px; background: #374151; border-radius: 2px; margin-top: 4px; flex: 1; }
.progress-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .3s; }
.dl-btn { font-size: 11px; background: var(--blue); color: #fff; border: none; padding: 3px 10px; border-radius: 4px; cursor: pointer; white-space: nowrap; margin-left: 6px; }
.dl-btn:hover { background: #2563eb; }
.batch-panel { display: none; }
.batch-panel.active { display: block; }
.video-preview { width: 100%; max-height: 300px; border-radius: 8px; margin-top: 12px; display: none; }
.video-preview.show { display: block; }
.result-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
.result-table th { text-align: left; padding: 8px 10px; color: var(--dim); border-bottom: 1px solid var(--border); background: #111827; }
.result-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.result-table .ok { color: var(--green); }
.result-table .fail { color: var(--red); }
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center">
    <h1>quick_sbs</h1><span class="badge">快速3D</span>
  </div>
  <span id="ffmpeg-status" class="warn"></span>
</header>

<div class="tabs">
  <button class="tab active" onclick="switchTab('single')">单个视频</button>
  <button class="tab" onclick="switchTab('batch')">批量处理</button>
</div>

<main>
  <!-- Single video -->
  <div id="panel-single" class="grid2">
    <div class="card">
      <div class="upload-area" id="drop-zone" onclick="document.getElementById('video-file').click()">
        <div class="icon">🎬</div>
        <div>点击选择视频 或 拖拽到此处</div>
        <div class="hint">支持 MP4, MKV, MOV, AVI, FLV, WebM 等</div>
        <input type="file" id="video-file" accept="video/*" style="display:none" onchange="onFileSelected(this)">
      </div>
      <div class="file-info" id="file-info"></div>

      <label style="margin-top:12px">平移像素 <span id="shift-val">6</span></label>
      <div class="slider-row">
        <input type="range" id="shift" min="2" max="20" value="6" step="1" oninput="document.getElementById('shift-val').textContent=this.value;updateEstimate()">
      </div>

      <label style="margin-top:12px">横向压窄 <span id="compress-val">25%</span></label>
      <div class="slider-row">
        <input type="range" id="compress" min="0" max="40" value="25" step="5" oninput="document.getElementById('compress-val').textContent=this.value+'%';updateEstimate()">
      </div>

      <label style="margin-top:12px">分辨率（最长边）</label>
      <select id="max-size" onchange="updateEstimate()">
        <option value="480">480</option>
        <option value="640">640</option>
        <option value="720">720</option>
        <option value="960">960</option>
        <option value="1280" selected>1280</option>
        <option value="1920">1920</option>
      </select>

      <div class="estimate" id="estimate">⏱ 选择视频后自动预估</div>

      <button class="btn btn-go" id="btn-single" onclick="submitSingle()" disabled>开始处理</button>
      <div id="single-jobs" class="job-list"></div>
    </div>
    <div class="card" id="output-panel">
      <video class="video-preview" id="output-video" controls></video>
      <div style="text-align:center;color:var(--dim);font-size:13px;margin-top:20px" id="output-placeholder">输出视频将出现在这里</div>
    </div>
  </div>

  <!-- Batch -->
  <div id="panel-batch" class="batch-panel">
    <div class="card">
      <div class="upload-area" id="batch-drop-zone" onclick="document.getElementById('batch-files').click()">
        <div class="icon">📁</div>
        <div>点击选择多个视频 或 拖拽到此处</div>
        <div class="hint">可一次选择多个文件</div>
        <input type="file" id="batch-files" accept="video/*" multiple style="display:none" onchange="onBatchFilesSelected(this)">
      </div>
      <div class="file-info" id="batch-file-info"></div>

      <label style="margin-top:12px">平移像素 <span id="b-shift-val">6</span></label>
      <div class="slider-row">
        <input type="range" id="b-shift" min="2" max="20" value="6" step="1" oninput="document.getElementById('b-shift-val').textContent=this.value">
      </div>

      <label style="margin-top:12px">横向压窄 <span id="b-compress-val">25%</span></label>
      <div class="slider-row">
        <input type="range" id="b-compress" min="0" max="40" value="25" step="5" oninput="document.getElementById('b-compress-val').textContent=this.value+'%'">
      </div>

      <label style="margin-top:12px">分辨率</label>
      <select id="b-max-size">
        <option value="480">480</option><option value="640">640</option><option value="720">720</option>
        <option value="960">960</option><option value="1280" selected>1280</option><option value="1920">1920</option>
      </select>

      <button class="btn btn-go" id="btn-batch" onclick="submitBatch()" disabled>批量处理</button>
      <table class="result-table" id="batch-results" style="display:none">
        <thead><tr><th>文件名</th><th>状态</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</main>

<script>
let currentTab = 'single';
let pollTimer = null;
let selectedFile = null;
let batchFiles = [];

// ── Tab switching ──
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0)===(tab==='single')));
  document.getElementById('panel-single').style.display = tab==='single' ? '' : 'none';
  document.getElementById('panel-batch').classList.toggle('active', tab==='batch');
  if (tab === 'batch') startPolling('batch-results');
  else startPolling('single-jobs');
}

// ── Drag & drop ──
['drop-zone','batch-drop-zone'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag'));
  el.addEventListener('drop', e => {
    e.preventDefault(); el.classList.remove('drag');
    const files = e.dataTransfer.files;
    if (id === 'drop-zone' && files.length > 0) {
      selectFile(files[0]);
      document.getElementById('video-file').files = files;
    } else if (id === 'batch-drop-zone') {
      selectBatchFiles(files);
      document.getElementById('batch-files').files = files;
    }
  });
});

// ── File selection ──
function onFileSelected(input) {
  if (input.files.length > 0) selectFile(input.files[0]);
}

function selectFile(file) {
  selectedFile = file;
  document.getElementById('file-info').textContent = '已选择: ' + file.name + ' (' + formatSize(file.size) + ')';
  document.getElementById('btn-single').disabled = false;
  updateEstimate();
}

function onBatchFilesSelected(input) {
  selectBatchFiles(input.files);
}

function selectBatchFiles(files) {
  batchFiles = Array.from(files);
  document.getElementById('batch-file-info').textContent = `已选择 ${batchFiles.length} 个视频`;
  document.getElementById('btn-batch').disabled = batchFiles.length === 0;
}

function formatSize(bytes) {
  if (bytes < 1024*1024) return (bytes/1024).toFixed(1)+' KB';
  if (bytes < 1024*1024*1024) return (bytes/(1024*1024)).toFixed(1)+' MB';
  return (bytes/(1024*1024*1024)).toFixed(1)+' GB';
}

// ── Estimate ──
function updateEstimate() {
  if (!selectedFile) return;
  const size = selectedFile.size;
  const dur = size / (5*1024*1024) * 60; // rough: ~5MB/min for 720p
  const maxSize = parseInt(document.getElementById('max-size').value);
  const factor = maxSize > 1280 ? 1.5 : maxSize < 720 ? 0.5 : 1.0;
  const secs = Math.max(3, dur * factor * 0.3); // quick mode: 30% of duration
  const m = Math.floor(secs/60);
  const s = Math.round(secs%60);
  document.getElementById('estimate').textContent = `⏱ 预计 ${m>0?m+'分':''}${s}秒（快速模式）`;
}

// ── Submit ──
async function submitSingle() {
  if (!selectedFile) return;
  const btn = document.getElementById('btn-single');
  btn.disabled = true; btn.textContent = '处理中...';

  const form = new FormData();
  form.append('video', selectedFile);
  form.append('shift', document.getElementById('shift').value);
  form.append('compress', document.getElementById('compress').value / 100);
  form.append('max_size', document.getElementById('max-size').value);

  try {
    const r = await fetch('/api/single', { method:'POST', body:form });
    if (!r.ok) {
      const text = await r.text();
      throw new Error(`HTTP ${r.status}: ${text.substring(0, 200)}`);
    }
    const job = await r.json();
    startPolling('single-jobs');
  } catch(e) {
    btn.disabled = false; btn.textContent = '开始处理';
    alert('提交失败: ' + e.message);
  }
}

async function submitBatch() {
  if (batchFiles.length === 0) return;
  const btn = document.getElementById('btn-batch');
  btn.disabled = true; btn.textContent = '批量处理中...';
  document.getElementById('batch-results').style.display = 'table';
  document.getElementById('batch-results').querySelector('tbody').innerHTML = '';

  const shift = document.getElementById('b-shift').value;
  const compress = document.getElementById('b-compress').value / 100;
  const maxSize = document.getElementById('b-max-size').value;

  for (const file of batchFiles) {
    const form = new FormData();
    form.append('video', file);
    form.append('shift', shift);
    form.append('compress', compress);
    form.append('max_size', maxSize);
    form.append('batch', '1');
    try {
      await fetch('/api/single', { method:'POST', body:form });
    } catch(e) { console.error(e); }
  }
  startPolling('batch-results');
}

// ── Polling ──
function startPolling(containerId) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(() => poll(containerId), 1200);
}

async function poll(containerId) {
  try {
    const r = await fetch('/api/jobs');
    const jobs = await r.json();
    if (!jobs || jobs.length === 0) return;

    if (containerId === 'single-jobs') {
      const el = document.getElementById('single-jobs');
      const latest = jobs[jobs.length-1];
      el.innerHTML = renderJob(latest);

      if (latest.status === 'done' && latest.out_id) {
        const v = document.getElementById('output-video');
        // Only (re)load the video when the output actually changes.
        // Reloading on every poll is what caused the preview to jump around
        // between different finished videos while the page sat idle.
        if (v.dataset.out !== latest.out_id) {
          v.src = '/api/download/' + latest.out_id;
          v.dataset.out = latest.out_id;
        }
        v.classList.add('show');
        document.getElementById('output-placeholder').style.display = 'none';
      }
      if (['done','error'].includes(latest.status)) {
        document.getElementById('btn-single').disabled = false;
        document.getElementById('btn-single').textContent = '开始处理';
      }
    } else {
      const tbody = document.getElementById('batch-results').querySelector('tbody');
      tbody.innerHTML = jobs.map(j => {
        const cls = j.status==='done' ? 'ok' : j.status==='error' ? 'fail' : '';
        const dl = j.out_id ? `<button class="dl-btn" onclick="window.open('/api/download/${j.out_id}')">下载</button>` : '';
        return `<tr><td>${j.filename}</td><td class="${cls}">${j.status==='running' ? j.msg||'处理中...' : j.status}${j.error ? '<br><small>'+j.error+'</small>' : ''}</td><td>${dl}</td></tr>`;
      }).join('');
      document.getElementById('batch-results').style.display = 'table';

      const allDone = jobs.every(j => j.status==='done' || j.status==='error');
      if (allDone) {
        document.getElementById('btn-batch').disabled = false;
        document.getElementById('btn-batch').textContent = '批量处理';
      }
    }
  } catch(e) {
    // server not ready yet
  }
}

function renderJob(j) {
  let bar = '';
  if (j.status === 'running') {
    bar = `<div class="progress-bar"><div class="progress-fill" style="width:${(j.progress*100).toFixed(0)}%"></div></div>`;
  }
  const cls = j.status==='done' ? 'done' : j.status==='error' ? 'error' : j.status==='running' ? 'running' : '';
  return `<div class="job">
    <span class="name">${j.filename}</span>
    <span class="status ${cls}">${j.status==='running'?j.msg||'处理中':j.status}${j.elapsed>0?' ('+j.elapsed.toFixed(0)+'s)':''}</span>
    ${bar}
    ${j.out_id?`<button class="dl-btn" onclick="window.open('/api/download/${j.out_id}')">下载</button>`:''}
  </div>`;
}

// ── Init ──
fetch('/api/stats').then(r=>r.json()).then(s => {
  if (!s.ffmpeg) document.getElementById('ffmpeg-status').textContent = '⚠ ffmpeg 未安装';
}).catch(()=>{});
</script>
</body>
</html>
